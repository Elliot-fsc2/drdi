name: Deploy Application

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # Set PHP 8.3 in path
            export PATH="/usr/local/lsws/lsphp83/bin:$PATH"
            
            # Navigate to the deployment path
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Put application in maintenance mode
            php artisan down --secret="github-actions" || true
            
            # Pull the latest changes from the repository
            git pull origin main
            
            # Install/update PHP dependencies
            php $(which composer || echo "composer") install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            # Install/update Node dependencies and build assets
            npm install
            npm run build
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear caches and optimize
            php artisan optimize:clear
            php artisan optimize
            
            # Take application out of maintenance mode
            php artisan up
            
            # Restart PM2 process
            pm2 restart 0
