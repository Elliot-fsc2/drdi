name: Deploy Application

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # Fail the deployment on the first error instead of reporting success
            set -e

            # Set PHP 8.3 in path
            export PATH="/usr/local/lsws/lsphp83/bin:$PATH"

            # Navigate to the deployment path
            cd ${{ secrets.DEPLOY_PATH }}

            # Put application in maintenance mode
            php artisan down --secret="github-actions" || true

            # Always bring the app back up when the script ends, even on failure
            trap 'php artisan up 2>/dev/null || true' EXIT

            # Pull the latest changes from the repository.
            # The previous deploy's `npm install` may have left a modified
            # package-lock.json behind; discard that drift so the pull can
            # always apply cleanly (the lockfile is committed and npm ci is
            # used below, so nothing legitimate is lost here).
            git checkout -- package-lock.json 2>/dev/null || true
            git pull origin main

            # Install/update PHP dependencies (full install matching the lock file:
            # --no-dev removes dev packages whose stale file autoload entries can
            # break every artisan command, leaving the site in maintenance mode)
            # Retry on transient failures (e.g. corrupted 0-byte archive downloads)
            COMPOSER_BIN=$(which composer || echo "composer")
            for attempt in 1 2 3; do
              echo "composer install (attempt $attempt)..."
              if php "$COMPOSER_BIN" install --no-interaction --prefer-dist --optimize-autoloader; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "composer install failed after 3 attempts" >&2
                exit 1
              fi
              php "$COMPOSER_BIN" clear-cache 2>/dev/null || true
            done

            # Sanity check: abort if the app cannot boot (broken vendor/autoloader)
            php artisan --version

            # Install/update Node dependencies and build assets.
            # npm ci installs exactly from the committed package-lock.json and
            # never rewrites it, so the working tree stays clean for next time.
            npm ci --no-audit --no-fund
            npm run build

            # Run database migrations
            php artisan migrate --force

            # Clear caches and optimize
            php artisan optimize:clear
            php artisan optimize

            # Take application out of maintenance mode
            php artisan up

            # Restart PM2 process
            pm2 restart 0
